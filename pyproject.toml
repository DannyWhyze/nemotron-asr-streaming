[project]
name = "stt-nemotron-3-5-asr-streaming-0-6"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "huggingface-hub>=2.1.1",
    "librosa>=1.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.5.0",
    "pytest>=8.0.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.12",
    "soundfile>=0.14.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "transformers>=5.13.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=13.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".venv",
    "transcribe_cpp",
    "docs_dw",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]




